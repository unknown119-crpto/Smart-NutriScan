{% extends 'base.html' %}
{% block title %}Register – Smart Nutrition Analyzer{% endblock %}
{% block auth_content %}
<div class="auth-bg">
    <div class="auth-card auth-card-wide">
        <div class="auth-logo">🥗</div>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Set up your nutrition profile</p>

        <div id="msg" class="alert hidden"></div>

        <form id="regForm" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Majid Khan" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="25" min="10" max="100" value="25">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" placeholder="70" value="70" step="0.5">
                </div>
                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" placeholder="170" value="170">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Activity Level</label>
                    <select id="activity">
                        <option value="sedentary">Sedentary (desk job)</option>
                        <option value="light">Light (1-3x/week)</option>
                        <option value="moderate" selected>Moderate (3-5x/week)</option>
                        <option value="active">Active (6-7x/week)</option>
                        <option value="very_active">Very Active (athlete)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary btn-full" id="regBtn">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="/login">Sign in →</a></p>
    </div>
</div>
<script>
document.getElementById('regForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.textContent = 'Creating…';
    btn.disabled = true;

    const res = await fetch('/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            age: parseInt(document.getElementById('age').value),
            weight: parseFloat(document.getElementById('weight').value),
            height: parseFloat(document.getElementById('height').value),
            gender: document.getElementById('gender').value,
            activity_level: document.getElementById('activity').value
        })
    });
    const data = await res.json();
    if (data.success) {
        showMsg('Account created! Redirecting to login…', 'success');
        setTimeout(() => window.location.href='/login', 1500);
    } else {
        showMsg(data.message, 'error');
        btn.textContent = 'Create Account';
        btn.disabled = false;
    }
});

function showMsg(msg, type){
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.className = 'alert ' + type;
}
</script>
{% endblock %}
