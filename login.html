{% extends 'base.html' %}
{% block title %}Login – Smart Nutrition Analyzer{% endblock %}
{% block auth_content %}
<div class="auth-bg">
    <div class="auth-card">
        <div class="auth-logo">🥗</div>
        <h1 class="auth-title">Smart Nutrition Analyzer</h1>
        <p class="auth-subtitle">Track, analyze & improve your diet</p>

        <div id="msg" class="alert hidden"></div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn-primary btn-full" id="loginBtn">
                Sign In
            </button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/register">Create one free →</a></p>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/dashboard';
    } else {
        showMsg(data.message, 'error');
        btn.textContent = 'Sign In';
        btn.disabled = false;
    }
});

function showMsg(msg, type){
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.className = 'alert ' + type;
}
</script>
{% endblock %}
